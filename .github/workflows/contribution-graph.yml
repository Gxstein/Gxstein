name: Update contribution graph

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution graph
        run: |
          mkdir -p assets
          curl -sSfL --retry 3 --retry-delay 5 \
            "https://ghchart.rshah.org/FF6B00/${{ github.repository_owner }}" \
            -o assets/contribution-graph.svg
          head -c 200 assets/contribution-graph.svg | grep -qi "<svg" || {
            echo "Resposta nao e um SVG valido"; exit 1; }

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          if git diff --staged --quiet; then
            echo "Sem mudanca no grafico."
          else
            git commit -m "chore: update contribution graph"
            git push
          fi
